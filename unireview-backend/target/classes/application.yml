server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: unireview-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unireview_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
  expiration-ms: 86400000 # 24 hours

# External Services Integrations
app:
  moderation:
    perspective-api-key: ${PERSPECTIVE_API_KEY:mock_perspective_key}
    perspective-api-url: https://commentanalyzer.googleapis.com/v1alpha1/comments:analyze
    toxicity-threshold: 0.7
  captcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:mock_recaptcha_secret_key}
    verify-url: https://www.google.com/recaptcha/api/siteverify
    enabled: false # Set to true in production

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
