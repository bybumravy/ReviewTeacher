version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unireview-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: unireview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./unireview-backend
    container_name: unireview-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unireview_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PERSPECTIVE_API_KEY: ${PERSPECTIVE_API_KEY:-mock_perspective_key}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-mock_recaptcha_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./unireview
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    container_name: unireview-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
